name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Diagnose git state
        run: |
          echo "== git autocrlf ==" && git config -l | grep -i autocrlf || echo "(unset)"
          echo "== git status ==" && git status --porcelain || true
          echo "== ls-files --eol ==" && git ls-files --eol analysis_options.yaml example/analysis_options.yaml
          echo "== diff (if any) ==" && git --no-pager diff -- analysis_options.yaml example/analysis_options.yaml | head -60 || true

      - name: Publish dry run
        run: flutter pub publish --dry-run
